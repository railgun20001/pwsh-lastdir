name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-pwsh-766:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PowerShell 7.6.6 for tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'pwsh-7.6.6')
      - name: Run tests
        shell: pwsh
        run: |
          $pwsh = Join-Path $env:RUNNER_TEMP 'pwsh-7.6.6/pwsh.exe'
          $windowsPowerShell = Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $pwsh -NoProfile -File ./tests/test.ps1 -ShellPath $pwsh -OtherShellPath $windowsPowerShell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $windowsPowerShell -NoProfile -File ./tests/test.ps1 -ShellPath $windowsPowerShell -OtherShellPath $pwsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
