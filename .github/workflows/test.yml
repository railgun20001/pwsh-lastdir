name: Test

on:
  push:
  pull_request:

jobs:
  windows-pwsh-766:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell 7.6.6 for tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'pwsh-7.6.6')
      - name: Run tests
        shell: pwsh
        run: |
          $pwsh = Join-Path $env:RUNNER_TEMP 'pwsh-7.6.6/pwsh.exe'
          & $pwsh -NoProfile -File ./tests/test.ps1 -PwshPath $pwsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
